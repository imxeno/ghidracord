name: Java CI with Gradle

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      ghidra_versions:
        description: 'Ghidra versions as a JSON array (for example, ["11.4.3", "12.1.3"])'
        required: true
        default: '["latest"]'
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build for Ghidra ${{ matrix.ghidra }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghidra: ${{ fromJSON(inputs.ghidra_versions || '["latest"]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Install Ghidra ${{ matrix.ghidra }}
        uses: antoniovazquezblanco/setup-ghidra@75c7686eb0b3e48eb7880941b6cac63e5fca8432 # v2.1.5
        with:
          version: ${{ matrix.ghidra }}
          sha256sum: online
          auth_token: ${{ github.token }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build extension
        run: ./gradlew buildExtension --no-daemon

      - name: Archive production artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Ghidracord-${{ matrix.ghidra }}
          path: dist/*.zip
          if-no-files-found: error
